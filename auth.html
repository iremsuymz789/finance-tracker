<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reach — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0F1512;
    --surface: #16211C;
    --surface-2: #1D2A23;
    --ink: #EDE8DE;
    --ink-dim: #9CA89E;
    --income: #8FBF6F;
    --expense: #D64933;
    --savings: #E8B84B;
    --line: rgba(237,232,222,0.12);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .card{
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 36px;
    position: relative;
  }
  .card::before{
    content: "";
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--savings), transparent);
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 8px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }
  label{
    display:block;
    font-size: 13px;
    color: var(--ink-dim);
    margin: 18px 0 6px;
  }
  input{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 12px;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }
  input:focus{
    outline: none;
    border-color: var(--savings);
  }
  .btn{
    width: 100%;
    margin-top: 26px;
    background: var(--savings);
    color: #16210F;
    border: none;
    border-radius: 3px;
    padding: 13px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn:hover{ opacity: 0.88; }
  .btn:disabled{ opacity: 0.5; cursor: default; }
  .switch{
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .switch button{
    background: none;
    border: none;
    color: var(--income);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .msg{
    margin-top: 16px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 3px;
    display: none;
  }
  .msg.error{ display:block; background: rgba(214,73,51,0.12); color: var(--expense); border: 1px solid rgba(214,73,51,0.3); }
  .msg.ok{ display:block; background: rgba(143,191,111,0.12); color: var(--income); border: 1px solid rgba(143,191,111,0.3); }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Reach · Finance Tracker</p>
  <h1 id="formTitle">Welcome back</h1>

  <form id="authForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" minlength="6">

    <button type="submit" class="btn" id="submitBtn">Sign in</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="switch">
    <span id="switchText">New here?</span>
    <button id="switchBtn" type="button">Create an account</button>
  </div>
</div>

<script src="supabaseClient.js"></script>
<script>
  let mode = "signin"; // or "signup"

  const form = document.getElementById("authForm");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const submitBtn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");
  const formTitle = document.getElementById("formTitle");
  const switchText = document.getElementById("switchText");
  const switchBtn = document.getElementById("switchBtn");

  // If already logged in, skip straight to the app
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "app.html";
  });

  switchBtn.addEventListener("click", () => {
    mode = mode === "signin" ? "signup" : "signin";
    if (mode === "signup") {
      formTitle.textContent = "Create your account";
      submitBtn.textContent = "Create account";
      switchText.textContent = "Already have an account?";
      switchBtn.textContent = "Sign in";
    } else {
      formTitle.textContent = "Welcome back";
      submitBtn.textContent = "Sign in";
      switchText.textContent = "New here?";
      switchBtn.textContent = "Create an account";
    }
    msg.className = "msg";
    msg.textContent = "";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    msg.className = "msg";
    msg.textContent = "";

    const email = emailEl.value.trim();
    const password = passwordEl.value;

    try {
      if (mode === "signup") {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        msg.className = "msg ok";
        msg.textContent = "Account created — you're signed in. Redirecting…";
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        msg.className = "msg ok";
        msg.textContent = "Signed in — redirecting…";
      }
      setTimeout(() => { window.location.href = "app.html"; }, 600);
    } catch (err) {
      msg.className = "msg error";
      msg.textContent = err.message || "Something went wrong. Please try again.";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
